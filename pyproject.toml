[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-bench"
version = "0.1.0"
description = "A deterministic benchmark for infrastructure-aware semantic workflow selection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
llm = ["openai>=2.0,<3"]
real-video = ["numpy>=2,<3", "opencv-python-headless>=4.12,<5", "pandas>=2.3,<4"]
scenario-mining = ["pyarrow>=18,<24"]

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=7.4,<9", "ruff>=0.11"]

[project.scripts]
infra-bench = "infra_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src/infra_bench/integration", "tests/test_mas_integration.py"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
