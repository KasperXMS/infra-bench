[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-bench"
version = "0.1.0"
description = "A deterministic benchmark for infrastructure-aware semantic workflow selection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]
llm = ["openai>=2.0,<3"]

[project.scripts]
infra-bench = "infra_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
